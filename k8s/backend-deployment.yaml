apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: globalmedx
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: globalmedx-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: globalmedx-secrets
                  key: MONGODB_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: globalmedx-secrets
                  key: JWT_SECRET
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: globalmedx-secrets
                  key: VAULT_TOKEN
            - name: VAULT_ADDR
              valueFrom:
                configMapKeyRef:
                  name: globalmedx-config
                  key: VAULT_ADDR
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: globalmedx-config
                  key: PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: globalmedx-config
                  key: LOG_LEVEL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: globalmedx
spec:
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: backend
  type: ClusterIP
